name: CI

on:
  push:
    branches: [Creator, main]
  pull_request:
    branches: [Creator, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore CryptoBook/CryptoBook.sln --locked-mode

      - name: Test Release
        run: dotnet test CryptoBook/CryptoBook.sln -c Release --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Publish Windows artifact
        run: dotnet publish CryptoBook/CryptoBook.csproj -c Release --no-restore --self-contained false -o artifacts/win-x64

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/win-x64 -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path.Substring($env:GITHUB_WORKSPACE.Length + 1))" } |
            Set-Content artifacts/SHA256SUMS.txt

      - name: Upload verified artifact
        uses: actions/upload-artifact@v7
        with:
          name: CryptoBook-win-x64
          path: artifacts
          if-no-files-found: error
