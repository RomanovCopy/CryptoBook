name: CI

on:
  push:
    branches: [Creator, main]
  pull_request:
    branches: [Creator, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore CryptoBook/CryptoBook.sln --locked-mode

      - name: Restore Windows x64 runtime
        run: dotnet restore CryptoBook/CryptoBook.csproj --locked-mode -r win-x64

      - name: Test Release
        run: dotnet test CryptoBook/CryptoBook.sln -c Release --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Build Windows installer
        shell: pwsh
        run: ./installer/Build-Installer.ps1 -NoRestore

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path.Substring($env:GITHUB_WORKSPACE.Length + 1))" } |
            Set-Content artifacts/SHA256SUMS.txt

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoBook-win-x64
          path: artifacts
          if-no-files-found: error
